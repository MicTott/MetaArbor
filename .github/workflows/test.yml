name: tests
on:
  push:
    branches: [main, consensus-prototype]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "./pkgs/python[all,test]"
      - run: python -m pytest pkgs/python/tests -q
